name: SDL3 GPU desktop build
# C17 desktop builds and data-free regression checks. No release publication.
on:
  workflow_dispatch:
  push:
    branches: ["master", "dev/c17"]
  pull_request:
    branches: [master]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libpng-dev libjpeg-dev zlib1g-dev libgnutls28-dev pkg-config libxss-dev libxtst-dev libxdamage-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev libdecor-0-dev wayland-protocols
      - name: Select Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: Get SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.0
          path: build-deps/SDL
      - name: Build SDL3
        shell: bash
        run: |
          cmake -S build-deps/SDL -B build-deps/sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build-deps/install"
          cmake --build build-deps/sdl-build --config Release --parallel 2
          cmake --install build-deps/sdl-build --config Release
      - name: Configure fork
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-deps/install" -DFTE_WERROR=OFF -DFTE_TOOL_QCCGUI=OFF -DFTE_TOOL_QCVM=ON -DFTE_ENGINE_CLIENT_ONLY=ON -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Compile engine, server and tools
        run: cmake --build build --config Release --parallel 2
      - name: Run data-free regression checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check C17 gameplay instructions
        if: runner.os != 'Windows'
        run: python3 tools/c17_compat.py --build build --out build/c17-compat --baseline-ref HEAD
      - name: Network fault injection with sanitizers
        if: runner.os == 'Linux'
        run: python3 tools/network_transport_tests.py --cc clang --out build/network-tests
      - name: Configure sanitizer tools
        if: runner.os != 'Windows'
        shell: bash
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-deps/install" -DFTE_SANITIZERS=ON -DFTE_ENGINE=OFF -DFTE_ENGINE_SERVER_ONLY=OFF -DFTE_TOOL_QCCGUI=OFF -DFTE_TOOL_QCVM=ON -DBUILD_TESTING=ON
      - name: Build sanitizer tools
        if: runner.os != 'Windows'
        run: cmake --build build-sanitize --target fteqcc qcvm c17-endian-check --parallel 2
      - name: Run sanitizer compiler and VM checks
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Preserve failed regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.cc || 'default' }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/qcc-tests/*.log
            build-sanitize/Testing/Temporary/LastTest.log
            build-sanitize/qcc-tests/*.log
            build/c17-compat/
          if-no-files-found: ignore
