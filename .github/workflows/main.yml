name: SDL3 GPU desktop build
# C17 desktop builds and data-free regression checks. No release publication.
on:
  workflow_dispatch:
  push:
    branches: ["master", "dev/c17", "dev/midi"]
  pull_request:
    branches: [master]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libpng-dev libjpeg-dev zlib1g-dev libgnutls28-dev libfluidsynth-dev pkg-config libxss-dev libxtst-dev libxdamage-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev libdecor-0-dev wayland-protocols
      - name: macOS MIDI dependency
        if: runner.os == 'macOS'
        run: brew install fluid-synth
      - name: Windows MIDI dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install fluidsynth:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Stage pinned MIDI instrument bank
        run: python3 tools/package_soundfont.py --download --out build-deps/soundfonts
      - name: Select Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: Get SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.0
          path: build-deps/SDL
      - name: Build SDL3
        shell: bash
        run: |
          cmake -S build-deps/SDL -B build-deps/sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build-deps/install"
          cmake --build build-deps/sdl-build --config Release --parallel 2
          cmake --install build-deps/sdl-build --config Release
      - name: Configure fork
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-deps/install" -DFTE_WERROR=OFF -DFTE_TOOL_QCCGUI=OFF -DFTE_TOOL_QCVM=ON -DFTE_ENGINE_CLIENT_ONLY=ON -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFTE_DEP_FLUIDSYNTH=ON -DFTE_MIDI_SOUNDFONT="$GITHUB_WORKSPACE/build-deps/soundfonts/FluidR3_GM.sf2"
      - name: Compile engine, server and tools
        run: cmake --build build --config Release --parallel 2
      - name: Run data-free regression checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check C17 gameplay instructions
        if: runner.os != 'Windows'
        run: python3 tools/c17_compat.py --build build --out build/c17-compat --baseline-ref HEAD
      - name: Network fault injection with sanitizers
        if: runner.os == 'Linux'
        run: python3 tools/network_transport_tests.py --cc clang --out build/network-tests
      - name: Package signatures with real GnuTLS
        if: runner.os == 'Linux'
        run: python3 tools/package_signature_tests.py --cc clang --gnutls --out build/package-tests
      - name: Configure sanitizer engine and tools
        if: runner.os != 'Windows'
        shell: bash
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-deps/install" -DFTE_SANITIZERS=ON -DFTE_ENGINE=ON -DFTE_ENGINE_SERVER_ONLY=ON -DFTE_ENGINE_CLIENT_ONLY=ON -DFTE_TOOL_QCCGUI=OFF -DFTE_TOOL_QCVM=ON -DBUILD_TESTING=ON -DFTE_DEP_FLUIDSYNTH=ON -DFTE_MIDI_SOUNDFONT="$GITHUB_WORKSPACE/build-deps/soundfonts/FluidR3_GM.sf2"
      - name: Build sanitizer engine and tools
        if: runner.os != 'Windows'
        run: cmake --build build-sanitize --target fteqw fteqw-sv fteqcc qcvm c17-endian-check gpu-renderer-math midi-tests --parallel 2
      - name: Run sanitizer engine, compiler, VM and parser checks
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Collect macOS crash reports
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/crash-reports
          sleep 3
          for report in "$HOME"/Library/Logs/DiagnosticReports/fteqw*.ips "$HOME"/Library/Logs/DiagnosticReports/fteqw*.crash /Library/Logs/DiagnosticReports/fteqw*.ips /Library/Logs/DiagnosticReports/fteqw*.crash; do
            if [ -f "$report" ]; then
              cp "$report" build/crash-reports/
            fi
          done
      - name: Preserve failed regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.cc || 'default' }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/crash-reports/
            build/qcc-tests/*.log
            build-sanitize/Testing/Temporary/LastTest.log
            build-sanitize/qcc-tests/*.log
            build-sanitize/parser-tests/
            build-sanitize/package-tests/
            build/package-tests/
            build-sanitize/engine-sanitize-tests/
            build/network-tests/
            build/midi-integration/**/engine.log
            build/midi-integration/**/results.json
            build-sanitize/midi-integration/**/engine.log
            build-sanitize/midi-integration/**/results.json
            build/midi-picker/**/engine.log
            build/midi-picker/**/results.json
            build/music-remap/**/engine.log
            build/music-remap/**/reload*.log
            build/music-remap/**/configs/*.cfg
            build-sanitize/midi-picker/**/engine.log
            build-sanitize/midi-picker/**/results.json
            build-sanitize/music-remap/**/engine.log
            build-sanitize/music-remap/**/reload*.log
            build-sanitize/music-remap/**/configs/*.cfg
            build/c17-compat/
          if-no-files-found: ignore
