name: SDL3 GPU desktop build
# Manual desktop build checks. No release publication or artifact upload steps.
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libpng-dev libjpeg-dev zlib1g-dev
      - name: Get SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.0
          path: build-deps/SDL
      - name: Build SDL3
        shell: bash
        run: |
          cmake -S build-deps/SDL -B build-deps/sdl-build -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build-deps/install"
          cmake --build build-deps/sdl-build --config Release --parallel
          cmake --install build-deps/sdl-build --config Release
      - name: Configure fork
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-deps/install" -DFTE_WERROR=OFF -DFTE_TOOL_QCCGUI=OFF
      - name: Compile engine, server and tools
        run: cmake --build build --config Release --target fteqw fteqw-sv imgtool fteqcc --parallel
