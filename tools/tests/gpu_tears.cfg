gamedir ad_v1_80p1final
ruleset_allow_in 1
cfg_save_auto 0
m_preset_chosen 1
con_notifytime 0
sv_csqc_progname gpu-rtt.dat
set gpu_test_ad 0
set gpu_test_water 0
set gpu_test_slime 0
set gpu_test_rtt 0
