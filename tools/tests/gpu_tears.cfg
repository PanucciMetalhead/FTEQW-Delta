defer 25 set gpu_test_tears 2
defer 30 screenshot gpu-tears-plants-nice.png
defer 31 gpu_info
defer 32 set gpu_test_tears 1
defer 33 fps_preset realtime
defer 33.1 r_shadow_realtime_dlight 1
defer 33.2 r_shadow_realtime_dlight_shadows 1
