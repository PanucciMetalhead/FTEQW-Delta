gamedir ad_v1_80p1final
ruleset_allow_in 1
cfg_save_auto 0
m_preset_chosen 1
con_notifytime 0
sv_csqc_progname gpu-rtt.dat
set gpu_test_tears 1
set gpu_test_ad 0
set gpu_test_water 0
set gpu_test_slime 0
set gpu_test_rtt 0
cl_maxfps 1000
cl_yieldcpu 0
cl_idlefps 0
vid_vsync 0
vid_fullscreen 2
vid_restart
r_drawviewmodel 0
map ad_tears
defer 6 pause
defer 7 fps_preset normal
defer 10 gpu_batching 0
defer 11 gpu_info
defer 12 screenshot gpu-perf-reference.png
defer 13 gpu_benchmark 8 faithful-reference
defer 23 gpu_batching 1
defer 24 gpu_info
defer 25 screenshot gpu-perf-batched.png
defer 26 gpu_benchmark 8 faithful-batched
defer 36 pause
defer 37 set gpu_test_tears 3
defer 38 gpu_benchmark 18 faithful-live-sweep
defer 58 screenshot gpu-perf-live.png
defer 59 gpu_info
defer 60 quit force
