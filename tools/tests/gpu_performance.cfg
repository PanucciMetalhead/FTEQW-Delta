gamedir ad_v1_80p1final
ruleset_allow_in 1
cfg_save_auto 0
m_preset_chosen 1
con_notifytime 0
sv_csqc_progname gpu-rtt.dat
set gpu_test_tears 1
set gpu_test_ad 0
set gpu_test_water 0
set gpu_test_slime 0
set gpu_test_rtt 0
cl_maxfps 1000
cl_yieldcpu 0
cl_idlefps 0
vid_vsync 0
vid_fullscreen 2
vid_restart
r_drawviewmodel 0
alias gpu_perf_start "fps_preset normal; gpu_benchmark 3 faithful-cold-entry world; map ad_tears"
defer 1 gpu_perf_start
defer 12 gpu_benchmark 3 faithful-warm-entry world
defer 16 pause
defer 20 gpu_batching 0
defer 21 gpu_info
defer 22 screenshot gpu-perf-reference.png
defer 23 gpu_benchmark 8 faithful-reference
defer 33 gpu_batching 1
defer 34 gpu_info
defer 35 screenshot gpu-perf-batched.png
defer 36 gpu_benchmark 8 faithful-batched
defer 46 pause
defer 47 set gpu_test_tears 3
defer 48 gpu_benchmark 18 faithful-live-sweep
defer 68 screenshot gpu-perf-live.png
defer 69 gpu_info
defer 70 quit force
