gamedir ad_v1_80p1final
ruleset_allow_in 1
cfg_save_auto 0
m_preset_chosen 1
con_notifytime 0
sv_csqc_progname gpu-rtt.dat
set gpu_test_tears 1
cl_maxfps 1000
cl_yieldcpu 0
cl_idlefps 0
vid_vsync 0
vid_fullscreen 2
vid_restart
r_drawviewmodel 0
alias gpu_perf_start "fps_preset normal; map ad_tears"
defer 1 gpu_perf_start
defer 10 pause
defer 11 r_dynamic 1
defer 11.1 gpu_lightmap_partial 0
defer 12 screenshot gpu-perf-lightmap-full.png
defer 13 gpu_benchmark 4 lightmap-full
defer 18 gpu_lightmap_partial 1
defer 19 screenshot gpu-perf-lightmap-partial.png
defer 20 gpu_benchmark 4 lightmap-partial
defer 25 gpu_lightmap_partial 0
defer 26 screenshot gpu-perf-lightmap-full-again.png
defer 27 gpu_benchmark 4 lightmap-full-again
defer 32 gpu_info
defer 33 quit force
